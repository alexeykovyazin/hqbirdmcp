# P6.1 T1 / ADR-026 — the security lane. Moved into the repo (it previously
# lived at the non-git AIDBA parent with subdirectory path assumptions and
# never ran).
# C1 without Firebird: tests Skip with a log (not a silent fail).
# Set FBMCP_REQUIRE_FIREBIRD=1 on the Windows HQbird host so those skips fail.
name: fbmcp-security

# Started by hand, and only by hand. This was a push-and-pull-request gate
# until 2026-09-11; the owner asked for CI to be manual across every
# repository.
#
# What that costs, written down rather than rediscovered: nothing here checks a
# commit unless somebody remembers to start it. A branch can be merged red,
# main can go red and stay red, and the run history stops being a record of
# what was green, because most commits will have no run at all. The Dependabot
# pull requests this repository now opens will arrive untested.
#
# To start one: Actions -> fbmcp-security -> Run workflow, and pick the branch. Or
# `gh workflow run fbmcp-security.yml --ref <branch>` from a checkout.
#
# The schedule below is kept. It is not a gate on a commit - it runs against
# whatever is on the branch at the time, unattended, which is the whole reason
# it exists. Making it manual too would leave nothing to notice what it
# watches for.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *" # nightly lane: longer fuzz budget (M6 gate)

# Nothing here writes anything back.
permissions:
  contents: read

# Two dispatches of the same branch would run the same tree twice. The second
# waits rather than cancelling the first: every run here is now something a
# person asked for on purpose, and cancelling one throws away the answer they
# were waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go mod verify
        run: go mod verify
      - name: gofmt gate
        run: |
          out=$(gofmt -l . | grep -v '^spikes/' || true)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -coverprofile=coverage.out
      - name: coverage ratchet (fail only on a drop; floor moves up per test_plan P4)
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub("%","",$3); print $3}')
          echo "total coverage: ${total}%"
          floor=45.5
          awk -v t="$total" -v f="$floor" 'BEGIN { exit (t+0 >= f-0.05) ? 0 : 1 }'             || { echo "coverage ${total}% dropped below the ${floor}% ratchet floor (test_plan.md P4)"; exit 1; }
      - name: govulncheck
        run: |
          # pinned: @latest (v1.8+) requires go >= 1.26, GOTOOLCHAIN=local below
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          govulncheck ./...

  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: three-arch trimpath binaries + SBOM + checksums
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/fbmcp-windows-amd64.exe ./cmd/fbmcp
          GOOS=linux   GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/fbmcp-linux-amd64 ./cmd/fbmcp
          GOOS=linux   GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o dist/fbmcp-linux-arm64 ./cmd/fbmcp
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/fbmcp-tray-windows-amd64.exe ./cmd/fbmcp-tray
          go build -trimpath -ldflags="-s -w" -o dist/fbmcpctl ./cmd/fbmcpctl
          go version -m dist/fbmcp-linux-amd64 > dist/sbom-fbmcp-linux-amd64.txt
          go version -m dist/fbmcp-linux-arm64 > dist/sbom-fbmcp-linux-arm64.txt
          go version -m dist/fbmcp-windows-amd64.exe > dist/sbom-fbmcp-windows-amd64.txt
          sha256sum dist/* > dist/SHA256SUMS
          cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: fbmcp-dist
          path: dist/

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: fuzz (short on push/PR, long on the nightly schedule)
        run: |
          # Committed seed corpora live in */testdata/fuzz and replay in
          # plain `go test`; this lane searches BEYOND them.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            PARSE=10m; EACH=5m
          else
            PARSE=20s; EACH=10s
          fi
          go test -fuzz=FuzzParse -fuzztime=$PARSE ./internal/fbparse
          go test -fuzz=FuzzSplit -fuzztime=$EACH ./internal/fbparse
          go test -fuzz=FuzzMatches -fuzztime=$EACH ./internal/schedule
          go test -fuzz=FuzzPlan -fuzztime=$EACH ./internal/retention
          go test -fuzz=FuzzScript -fuzztime=$EACH ./internal/classify
          go test -fuzz=FuzzBearer -fuzztime=$EACH ./internal/transport
