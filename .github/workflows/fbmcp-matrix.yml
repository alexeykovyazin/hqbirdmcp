# E.5 Linux matrix CI (phase8_plan D7). One job per Firebird major; each
# spins the official container as a service, generates the dev config
# against it (packaging/docker/matrix-config.sh), and runs the unit suite +
# the live suites with skips forced to fail (FBMCP_REQUIRE_FIREBIRD=1).
#
# Best-effort by plan: M4 (8M) executes and tunes this on a real Docker
# host. The killharness's full loop stays host-side (Windows services +
# local installs); the CI lane runs its two config-independent scenarios.
name: fbmcp-matrix

on:
  workflow_dispatch:
  pull_request:
    paths: ["packaging/docker/**", "internal/**", "cmd/**"]
  schedule:
    - cron: "43 3 * * *" # nightly lane

jobs:
  matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # firebirdsql/firebird dropped the old "3.0"/"4.0"/"5.0" floating
          # tags and every 2.5 tag (2026-09); current aliases are 3/4/5 and
          # 2.5 lives only on the pre-rename jacobalberty/firebird image.
          # `data` is each image's native DB dir — it is bind-mounted from
          # the host at the SAME path so host-side gstat (which reads the
          # files directly) and the server (attach strings) agree on paths.
          - fb: "2.5"
            image: "jacobalberty/firebird"
            tag: "2.5-ss"
            data: "/firebird/data"
          - fb: "3.0"
            image: "firebirdsql/firebird"
            tag: "3"
            data: "/var/lib/firebird/data"
          - fb: "4.0"
            image: "firebirdsql/firebird"
            tag: "4"
            data: "/var/lib/firebird/data"
          - fb: "5.0"
            image: "firebirdsql/firebird"
            tag: "5"
            data: "/var/lib/firebird/data"
    services:
      firebird:
        image: ${{ matrix.image }}:${{ matrix.tag }}
        ports:
          - 3050:3050
        env:
          # jacobalberty (2.5) reads ISC_PASSWORD; firebirdsql (3/4/5) reads
          # FIREBIRD_ROOT_PASSWORD — each image ignores the other's var
          ISC_PASSWORD: masterkey
          FIREBIRD_ROOT_PASSWORD: masterkey
          FIREBIRD_PASSWORD: masterkey
          # newer image builds resolve this relative to /firebird/data
          FIREBIRD_DATABASE: employee.fdb
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/localhost/3050'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 60
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Firebird client tools (isql/gstat/gbak for the subprocess routes)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq firebird3.0-utils firebird3.0-server-utils \
            || sudo apt-get install -y -qq firebird-utils firebird3.0-server-utils
      - name: expose container tools at bin_dir (Debian renames isql/gstat to *-fb)
        run: |
          sudo mkdir -p /usr/local/firebird/bin
          for b in isql gstat nbackup gbak fbsvcmgr gfix gsec; do
            src="$(command -v "$b" 2>/dev/null || command -v "$b-fb" 2>/dev/null || ls /usr/lib/firebird/*/bin/"$b" 2>/dev/null | head -1)"
            [ -n "$src" ] && sudo ln -sf "$(readlink -f "$src")" "/usr/local/firebird/bin/$b"
          done
          ls -la /usr/local/firebird/bin
      - name: restore the employee sample over the empty container DB, then seed it
        run: |
          ISQL="$(command -v isql-fb || command -v isql)"
          GBAK="$(command -v gbak-fb || command -v gbak)"
          DSN="localhost/3050:${{ matrix.data }}/employee.fdb"
          "$GBAK" -rep -user SYSDBA -password masterkey \
            packaging/docker/testdata/employee.fbk "$DSN"
          "$ISQL" -q -user SYSDBA -password masterkey "$DSN" \
            -i packaging/docker/seed-employee.sql
      - name: mirror the container DB to the same host path (gstat reads files directly)
        run: |
          CID=$(docker ps -q --filter "ancestor=${{ matrix.image }}:${{ matrix.tag }}" | head -1)
          test -n "$CID" || { echo "firebird service container not found" >&2; exit 1; }
          sudo mkdir -p "${{ matrix.data }}"
          sudo docker cp "$CID":${{ matrix.data }}/employee.fdb "${{ matrix.data }}/employee.fdb"
          sudo cp "${{ matrix.data }}/employee.fdb" "${{ matrix.data }}/employee5std.fdb"
          sudo chmod a+r "${{ matrix.data }}/employee.fdb" "${{ matrix.data }}/employee5std.fdb"
          ls -la "${{ matrix.data }}"
      - name: generate matrix config
        env:
          FBMCP_MATRIX_INSTANCE: fb-${{ matrix.fb }}
          FBMCP_MATRIX_HOST: localhost
          FBMCP_MATRIX_DBPATH: ${{ matrix.data }}
        shell: bash
        run: |
          bash packaging/docker/matrix-config.sh
      - name: unit + live suites (skips fail)
        env:
          FBMCP_DEV_PW: masterkey
          FBMCP_REQUIRE_FIREBIRD: "1"
          FBMCP_FUSE_DB: ${{ matrix.data }}/employee.fdb
          FBMCP_FUSE_ADDR: localhost:3050
          FBMCP_DIFF_WORK: /tmp/fbmcp-matrix/work
          FBMCP_QUERY_LIVE: "1"
          FBMCP_GSTAT_LIVE: "1"
          FBMCP_ADVICE_LIVE: "1"
          FBMCP_MIGRATE_LIVE: "1"
          FBMCP_DIFF_LIVE: "1"
          FBMCP_TRENDS_LIVE: "1"
        run: go test ./... -count=1 -timeout 25m
      - name: linux binary + checksum (gate §9-3 evidence per arch)
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o dist/fbmcp-linux-amd64 ./cmd/fbmcp
          sha256sum dist/fbmcp-linux-amd64
      - name: reduced chaos loop (config-independent scenarios)
        env:
          FBMCP_DEV_PW: masterkey
          FBMCP_REQUIRE_FIREBIRD: "1"
          FBMCP_KILLHARNESS: "1"
        run: go test ./internal/killharness -count=1 -run 'TestKillGatePending|TestKillMidPersist' -timeout 20m
