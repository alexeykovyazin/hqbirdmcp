      backup_dir: E:\temp
      work_dir: C:/HQbirdData/output/fbmcp-spike/work
      ro_user: SYSDBA
      ro_secret_env: FBMCP_DEV_PW
      admin_user: SYSDBA
      admin_secret_env: FBMCP_DEV_PW
    # stock Firebird 5 example database (instance fb5std has no running
    # server — usable by fb_gstat, not by SQL-backed tools)
    - id: employee5std
      instance: fb5std
      path: C:\Firebird5\examples\empbuild\EMPLOYEE.FDB
